services:
  postgres:
    image: postgres:16-alpine
    container_name: nexgradia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexgradia_db}
      POSTGRES_USER: ${DB_USER:-nexgradia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexgradia_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nexgradia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexgradia_user} -d ${DB_NAME:-nexgradia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexgradia_pg_data:
    name: nexgradia_pg_data
