spring:
  application:
    name: nexgradia-backend-test

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

server:
  port: -1

app:
  jwt:
    secret: nexgradia_test_jwt_secret_key_at_least_32_bytes_long_hmac_sha256
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
  storage:
    resume-dir: target/test-storage/resumes
    max-file-size-bytes: 5242880 # 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
