spring:
  application:
    name: nexgradia-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexgradia_db}}
    username: ${DB_USER:nexgradia_user}
    password: ${DB_PASSWORD:nexgradia_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:nexgradia_default_development_secret_key_needs_to_be_at_least_32_bytes_long_for_hmac_sha256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    resume-dir: ${RESUME_STORAGE_DIR:storage/resumes}
    max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:5242880} # 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
